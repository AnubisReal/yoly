name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.site-paused'
  workflow_dispatch:
    inputs:
      paused:
        description: 'Pausar web (desmarca para activarla)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read and save pause setting
        id: mode
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PAUSE: ${{ inputs.paused }}
        with:
          script: |
            const fs = require('fs');
            const path = '.site-paused';
            let paused = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').trim() === 'true'
              : true;
            if (process.env.EVENT_NAME === 'workflow_dispatch') {
              paused = process.env.REQUESTED_PAUSE === 'true';
              const { owner, repo } = context.repo;
              let sha;
              try {
                const result = await github.rest.repos.getContent({
                  owner, repo, path, ref: 'main'
                });
                sha = result.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const content = String(paused) + '\n';
              if (!fs.existsSync(path) || fs.readFileSync(path, 'utf8') !== content) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo, path, branch: 'main', sha,
                  message: paused ? 'Pause website [skip ci]' : 'Activate website [skip ci]',
                  content: Buffer.from(content).toString('base64')
                });
              }
            }
            core.setOutput('paused', String(paused));
            await core.summary.addHeading(paused ? 'Web pausada' : 'Web activa').write();

      - name: Setup Node
        if: steps.mode.outputs.paused != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.mode.outputs.paused != 'true'
        run: npm ci

      - name: Build
        if: steps.mode.outputs.paused != 'true'
        run: npm run build

      - name: Create blank website
        if: steps.mode.outputs.paused == 'true'
        run: |
          mkdir -p dist
          printf '%s\n' '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title></title></head><body></body></html>' > dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
